apiVersion: v1
kind: Namespace
metadata:
  name: todo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: get-sa
  namespace: todo

---
# Production-ready Deployment for `get` backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-deployment
  namespace: todo
  labels:
    app: get
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: get
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: get
        component: backend
    spec:
      serviceAccountName: get-sa
      securityContext:
        fsGroup: 2000
      containers:
      - name: get
        image: 1anand1/get-tasks:stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: CONNECTION_STRING
              name: todosecret
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

---
# Service to expose the backend inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: get-svc
  namespace: todo
  labels:
    app: get
    component: backend
spec:
  type: ClusterIP
  selector:
    app: get
  ports:
    - name: http
      port: 80
      targetPort: 8000

---
# Ingress to expose the service externally via Azure Application Gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: get-ingress
  namespace: todo
  labels:
    app: get
    component: backend
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: get.bhushan.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: get-svc
            port:
              number: 80

---
# HorizontalPodAutoscaler for the deployment (requires Metrics Server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: get-hpa
  namespace: todo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: get-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
# PodDisruptionBudget to ensure availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: get-pdb
  namespace: todo
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: get
      component: backend
